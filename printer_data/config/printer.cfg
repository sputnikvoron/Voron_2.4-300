[include mainsail.cfg]
[include sb2209.cfg]
[include start_macro.cfg]
[include macros.cfg]
#[include KlipperScreen.cfg]
[include stealthburner_leds.cfg]
#[include runout.cfg]

#####################################################################
#   UUID Setting
#####################################################################

[mcu]
canbus_uuid: 1b4bf04f4943
#restart_method: command

[mcu EBBCan]
canbus_uuid: a7872bbb16d6

[printer]
kinematics: corexy
max_velocity: 300  
max_accel: 4900
max_z_velocity: 18
max_z_accel: 350
square_corner_velocity: 5.0

#####################################################################
# 	LED Control
#####################################################################

# TODO: Install LED bars and configure LEDs. These will be neopixel types
[output_pin caselight]
#Chamber Lighting - HE2 Connector (Optional)
pin: PA3
pwm:true
shutdown_value: 0
cycle_time: 0.01

#####################################################################
# 	X/Y Stepper Settings
#####################################################################

## X Stepper on Motor1(B Motor)
[stepper_x]
step_pin: PE6
dir_pin: PE5
enable_pin: !PC14
microsteps: 16
rotation_distance: 40
full_steps_per_rotation:200
endstop_pin: ^EBBCan:gpio24
position_min: 0
##--------------------------------------------------------------------

##	Uncomment for 300mm build
position_endstop: 300
position_max: 300

##--------------------------------------------------------------------
homing_speed: 70   #Max 100
homing_retract_dist: 5
homing_positive_dir: true

[tmc2209 stepper_x]
uart_pin: PC13
#interpolate: True
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

## Y Stepper on Motor2 (A Motor)
[stepper_y]
step_pin: PE2
dir_pin: PE1
enable_pin: !PE4
microsteps: 16
rotation_distance: 40
endstop_pin: ^PF3
full_steps_per_rotation:200
position_min: 0
##--------------------------------------------------------------------

position_endstop: 300
position_max: 300

##--------------------------------------------------------------------
homing_speed: 100
homing_retract_dist: 5
homing_positive_dir: true

[tmc2209 stepper_y]
uart_pin: PE3
#interpolate: True
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

#####################################################################
# 	Z Stepper Settings
#####################################################################

## Z0 Stepper - Front Left on MOTOR3_A
[stepper_z]
step_pin: PB8
dir_pin: PB7
enable_pin: !PE0
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16
endstop_pin: probe:z_virtual_endstop

position_max: 290

##--------------------------------------------------------------------
position_min: -5
homing_speed: 8
second_homing_speed: 3
homing_retract_dist: 3

[tmc2209 stepper_z]
uart_pin: PB9
#interpolate: true
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

##	Z1 Stepper - Rear Left on Motor4
[stepper_z1]
step_pin: PB4
dir_pin: !PB3
enable_pin: !PB6
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16

[tmc2209 stepper_z1]
uart_pin: PB5
#diag_pin: PF1
#interpolate: true
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

##	Z2 Stepper - Rear Right on Motor5
[stepper_z2]
step_pin: PG13
dir_pin: PG12
enable_pin: !PG15
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16

[tmc2209 stepper_z2]
uart_pin: PG14
#interpolate: true
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

##	Z3 Stepper - Front Right on Motor6
[stepper_z3]
step_pin: PG9
dir_pin: !PD7
enable_pin: !PG11
rotation_distance: 40
gear_ratio: 80:16
microsteps: 16

[tmc2209 stepper_z3]
uart_pin: PG10
#interpolate: true
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

[filament_switch_sensor Filament_Runout]
##	Connected to SB2209
pause_on_runout: TRUE
runout_gcode: 
	M600
insert_gcode:
    M117 OM NOM NOM
    #SET_LED LED=CASELIGHT RED=0 GREEN=1 BLUE=0 WHITE=0 TRANSMIT=1
    #UPDATE_DELAYED_GCODE ID=CLEAR_LEDOTEXT DURATION=5
event_delay: 3.0
#   The minimum amount of time in seconds to delay between events.
#   Events triggered during this time period will be silently
#   ignored. The default is 3 seconds.
pause_delay: 10
switch_pin: EBBCan:gpio21

[gcode_macro M600]
description: Pause for filament change with custom park position
gcode:
    {% if printer.pause_resume.is_paused %}
        {action_respond_info("Already paused")}
    {% elif printer.toolhead.homed_axes != "xyz" %}
        {action_respond_info("Please home XYZ first")}
    {% else %}
        PAUSE
        SET_IDLE_TIMEOUT TIMEOUT=7200
        M300 P300 S1000 #Beep
        PARK_MACRO
        M300 P300 S2000 #Beep
        M300 P300 S4000 #Beep
        #SET_LED LED=CASELIGHT RED=1 GREEN=0 BLUE=0 WHITE=0.3 TRANSMIT=1
        UNLOAD
        M117 FEED MEEEE
    {% endif %}

[gcode_macro PAUSE_MACRO]
gcode:
    PAUSE
    M300 P150 S1000 #Beep
    PARK_MACRO
    M300 P150 S1000 #Beep
    #SET_LED LED=CASELIGHT RED=0 GREEN=0 BLUE=1 WHITE=0 TRANSMIT=1
    M300 P150 S1000 #Beep
    SET_IDLE_TIMEOUT TIMEOUT=7200
    
[gcode_macro RESUME_MACRO]
gcode:
    M117  RESUMING...
    {% set svv = printer.save_variables.variables %}
    SET_LED LED=CASELIGHT RED={svv.red} GREEN={svv.green} BLUE={svv.blue} WHITE={svv.white} TRANSMIT=1
    RESUME
    M117
    UPDATE_DELAYED_GCODE ID=PROGRESS_BAR_LED DURATION=5

#####################################################################
# 	Stealthburner
#####################################################################

##Partcooling##
[fan]
pin: EBBCan:gpio13
max_power: 1.0
shutdown_speed: 0
cycle_time: 0.01
hardware_pwm: False
kick_start_time: 0.1
off_below: 0.0
#enable_pin: 

##Hotend##
[heater_fan hotend_fan]
pin: EBBCan:gpio14
max_power: 1.0
shutdown_speed: 0
cycle_time: 0.01
hardware_pwm: False
kick_start_time: 0.1
off_below: 0.0
heater: extruder
heater_temp: 50.0
##  If you are experiencing back flow, you can reduce fan_speed
fan_speed: 1.0

#Nevermore##
[fan_generic nevermore]
pin: PF7
max_power: 1.0
shutdown_speed: 0
cycle_time: 0.01
hardware_pwm: False
kick_start_time: 0.1
off_below: 0.0
#enable_pin: 

##M8P#
[fan_generic M8P]
pin: PF9
max_power: 1.0
shutdown_speed: 0
cycle_time: 0.01
hardware_pwm: False
kick_start_time: 0.1
off_below: 0.0
#enable_pin: 

##PSU#
[fan_generic PSU]
pin: PF6
max_power: 1.0
shutdown_speed: 0
cycle_time: 0.01
hardware_pwm: False
kick_start_time: 0.1
off_below: 0.0
#enable_pin: 

##Exhaust##
[fan_generic generic_exhaust_fan]
pin: PF8
max_power: 1.0
shutdown_speed: 0
cycle_time: 0.01
hardware_pwm: False
kick_start_time: 0.1
off_below: 0.0

#####################################################################
# 	Bed Heater
#####################################################################

[heater_bed]
heater_pin: PA1
sensor_type:Generic 3950
sensor_pin: PB1
max_power: 1
min_temp: 0
max_temp: 120
#control: pid
#pid_kp: 58.437
#pid_ki: 2.347
#pid_kd: 363.769

[temperature_sensor Manta M8P V2]
sensor_type: temperature_mcu

[temperature_sensor CB1]
sensor_type: temperature_host

#####################################################################
# 	Voron TAP
#####################################################################

[probe]
pin: ^EBBCan: gpio22
x_offset: 0
y_offset: 0
#z_offset: 0
speed: 14.0 #15 might be default, higher speed might give more false values
lift_speed: 20
samples: 3
samples_result: median
sample_retract_dist: 3.0
samples_tolerance: 0.02 #0.06 is default, use higher number for bigger tolerance
samples_tolerance_retries: 3


activate_gcode:
    {% set PROBE_TEMP = 150 %}
    {% set MAX_TEMP = PROBE_TEMP + 5 %}
    {% set ACTUAL_TEMP = printer.extruder.temperature %}
    {% set TARGET_TEMP = printer.extruder.target %}

    {% if TARGET_TEMP > PROBE_TEMP %}
        { action_respond_info('Extruder temperature target of %.1fC is too high, lowering to %.1fC' % (TARGET_TEMP, PROBE_TEMP)) }
        M109 S{ PROBE_TEMP }
    {% else %}
        # Temperature target is already low enough, but nozzle may still be too hot.
        {% if ACTUAL_TEMP > MAX_TEMP %}
            { action_respond_info('Extruder temperature %.1fC is still too high, waiting until below %.1fC' % (ACTUAL_TEMP, MAX_TEMP)) }
            TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={ MAX_TEMP }
        {% endif %}
    {% endif %}
    
##################################################################
#             BED MESH                  #
##################################################################

[bed_mesh]
mesh_min = 30, 30
mesh_max = 270, 270
speed = 400
horizontal_move_z = 10
probe_count = 6,6
adaptive_margin: 0
algorithm = bicubic
##[(7x7)-1] / 2 = 24
##[(5x5)-1] / 2 = 12
##[(9x9)-1] / 2 = 40
#relative_reference_index: 40
zero_reference_position: 150, 150
#relative_reference_index: 15
split_delta_z = 0.0125
move_check_distance = 3
mesh_pps = 4,4
fade_start = 0
fade_end = 2
fade_target = 0

##################################################################
#             Homing and Gantry Adjustment Routines
##################################################################
[idle_timeout]
timeout: 1800

[safe_z_home]
##	XY Location of the Z Endstop Switch
##	Update -10,-10 to the XY coordinates of your endstop pin 
##	(such as 157,305) after going through Z Endstop Pin
##	Location Definition step.
home_xy_position:150,150
speed:100
z_hop:10

[quad_gantry_level]

##	Gantry Corners for 300mm Build
##	Uncomment for 300mm build
gantry_corners:
  -60,-10
  360,370
#Probe points
points:
  50,25
  50,225
  250,225
  250,25
#--------------------------------------------------------------------
speed: 400
horizontal_move_z: 10
retries: 5 #default is 5
retry_tolerance: 0.0085 #default is 0.0075
max_adjust: 10

[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PE7, EXP1_2=PG1,
    EXP1_3=PG0, EXP1_4=PF15,
    EXP1_5=PF14, EXP1_6=PF13,    # Slot in the socket on this side
    EXP1_7=PF12, EXP1_8=PF11,
    EXP1_9=<GND>, EXP1_10=<5V>,

    # EXP2 header
    EXP2_1=PE13, EXP2_2=PE12,
    EXP2_3=PE15, EXP2_4=PE11,
    EXP2_5=PE10, EXP2_6=PE14,      # Slot in the socket on this side
    EXP2_7=PE8, EXP2_8=<RST>,
    EXP2_9=<GND>, EXP2_10=<NC>

